<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Anonymously</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500&family=Inconsolata:wght@500&family=Patrick+Hand+SC&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="message.css">
</head>

<body>
    <div class="primary_body_content">
        <div class="header">
            <h2>Talk To Your Mentor/Faculty Anonymously</h2>
        </div>
        <div class="main_content">
            <form action="">

                <div class="blockfrBranch blocks">
                    <div class="checkbox">
                        <label for="branch">
                            <span class="span"><span class="item">Branch</span><span class="colon">:</span></span>
                        </label>
                        <div class="input">
                            <select name="branch" id="branch" required>
                                <option value="other">Select your Branch</option>
                                <option value="cse">Computer Science and Engineering</option>
                                <option value="ise">Information Science and Engineering</option>

                                <option value="eee">Electricals and Electronics and Engineering</option>

                                <option value="ece">Electricals and Communication and Engineering</option>

                                <option value="ce"> civil Engineering</option>
                                <option value="me">Mechanical Engineering</option>

                                <option value="aiml">Artificial Intelligence and Machine Learning and Engineering
                                </option>

                                <option value="csbs">Computer Science and Business Studies and Engineering</option>
                            </select>
                        </div>
                        <p>(* Branch of faculty)</p>
                    </div>
                </div>

                <div class="blockforFaculties blocks">
                    <label for="faculties">
                        <span class="span"><span class="item">Complain To</span><span class="colon">:</span></span>
                    </label>
                    <div class="input">
                        <select name="faculties" id="faculties" disabled required>
                            <option value="otherFaculty">Select the Faculty</option>
                        </select>
                    </div>
                </div>

                <div class="blockforMessage blocks">
                    <textarea required name="message" id="message" placeholder="Express Your Querry Here"></textarea>
                </div>

                <div class="blockforCheckBox blocks">
                    <input type="checkbox" name="agreed" id="agreed" required>
                    <label for="agreed">I'm Okay to not reveal my Name with <span id="teacherName">teacher</span>
                    </label>
                </div>

                <div class="blockforCheckBox blocks">
                    <input type="submit" value="submit" title="Please select the checkbox">
                </div>


            </form>

        </div>
        <div class="extra">
            <div class="extra_content">
                <div class="main_name">
                    Your CareTaker
                </div>
                <div class="message">
                    <p class="p1">Dont be afraid to express your emotions</p>
                    <p class="p2">We completely assure you that your name will not be revealed</p>
                </div>
            </div>
            <div class="extraimg">
                <img src="extra_image.png" alt="">
            </div>
        </div>
    </div>

    <script src="message.js"></script>
</body>

</html>
